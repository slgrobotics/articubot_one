#
# Simulated Seggy robot docking configuration for Nav2 (in assets/worlds/test_robot_world.sdf).
#
# Applied to the standard Nav2 configuration at launch when enable_docking=true.
# Merged over standard Nav2 params, not a full replacement.
# Named database entries are derived from docking_sim.yaml, never duplicated here.
# see https://github.com/slgrobotics/dock_detector/blob/main/dock_detector/nav2_config_merger.py

# see https://docs.nav2.org/rolling/configuration_and_development/configuration_guide/core_servers/configuring_docking_server/
#     https://github.com/open-navigation/opennav_docking
#     https://docs.ros.org/en/lyrical/p/opennav_docking/index.html
#     https://index.ros.org/r/opennav_docking/
#     
docking_server:
  ros__parameters:
    controller_frequency: 20.0
    initial_perception_timeout: 8.0
    dock_approach_timeout: 90.0
    max_retries: 2
    fixed_frame: odom
    base_frame: base_link
    dock_prestaging_tolerance: 0.10
    lidar_dock:
      trace_enabled: true
      plugin: dock_detector_nav2::LidarDock
      dock_direction: forward
      #dock_direction: backward
      rotate_to_dock: false
      # Stage inside the measured close-range detection envelope; floor cross is at 0.8 m.
      staging_x_offset: -0.5
      # Face into the bay at staging; the detector already reports inward yaw.
      staging_yaw_offset: 0.0
      #staging_yaw_offset: 3.141592653589793   # for backward-facing docking
      docking_threshold: 0.025
      docking_threshold_yaw: 5.0  # degrees
      external_detection_timeout: 0.5
      selection_timeout: 3.0
      filter_coef: 0.1
    controller:
      v_linear_min: 0.01
      v_linear_max: 0.035
      v_angular_max: 0.08
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint

# Keep the public docking action active while finishing yaw at the parking point.
docking_alignment:
  ros__parameters:
    max_insertion_travel: 0.05  # meters, 0 disables charging insertion
    alignment_position_margin: 0.02  # additional tolerance while aligning after Nav2 reaches position, meters
    angular_speed: 0.08  # rad/s
    alignment_timeout: 12.0  # seconds after reacquiring the dock
